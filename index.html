<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Lab</title>
<meta name="description" content="Drag-and-drop location analytics on a live map: add data, drop an analysis on a layer, read the result.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="lib/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=12">
<script src="lib/maplibre-gl.js"></script>
<script src="lib/h3-js.umd.js"></script>
<script src="lib/flatgeobuf-geojson.min.js"></script>
<script src="lib/geotiff.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b>Location Lab</b></div>
  <div class="seg" role="group" aria-label="Country">
    <button id="geo-india" class="on" data-geo="india">India · Gurugram</button>
    <button id="geo-singapore" data-geo="singapore">Singapore</button>
  </div>
  <span class="spacer"></span>
  <a class="ghost" id="guide" href="india/" target="_blank" rel="noopener">Guide</a>
  <button id="reset" class="ghost">Clear map</button>
</header>
<main class="app">
  <aside class="side" aria-label="Layers and analysis">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="layers" aria-selected="true">Layers</button>
      <button role="tab" data-tab="analysis" aria-selected="false">Analysis</button>
    </nav>
    <section id="tab-layers" class="pane">
      <button id="adddata" class="primary">+ Add data</button>
      <div id="layercards"></div>
    </section>
    <section id="tab-analysis" class="pane" hidden>
      <p class="hint">Drag a tool onto the map or onto a layer, or click it.</p>
      <div id="tiles"></div>
      <h4 class="sub">History</h4>
      <ol id="history" class="history"><li class="empty">Analyses you run appear here.</li></ol>
    </section>
    <section id="config" class="pane" hidden>
      <button id="back" class="link">← All tools</button>
      <h2 id="cfg-title"></h2>
      <p id="cfg-what" class="what"></p>
      <div id="cfg-params" class="params"></div>
      <button id="cfg-run" class="primary">Run</button>
      <div id="cfg-status" class="status"></div>
    </section>
  </aside>
  <section class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legend" hidden></div>
    <div class="pickhint" id="pickhint" hidden>Click on the map to choose a point · <button id="pickcancel" class="ghost sm">Cancel</button></div>
    <div class="dropveil" id="dropveil" hidden><span id="dropmsg">Drop here</span></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </section>
  <aside class="results" id="results" hidden aria-label="Results">
    <div class="rh"><b>Results</b><button id="closeres" class="x" aria-label="Close results">×</button></div>
    <div id="reslist"></div>
  </aside>
</main>
<dialog id="datadlg" aria-labelledby="dlgtitle">
  <div class="dlghead"><h2 id="dlgtitle">Add data</h2><button class="x" id="dlgclose" aria-label="Close">×</button></div>
  <div class="dlgfmt"><label for="fmtsel">File format</label><select id="fmtsel"><option value="geojson">GeoJSON</option><option value="parquet">GeoParquet</option><option value="fgb">FlatGeobuf</option></select><small>Same data, different files. Compare the sizes after loading.</small></div>
  <div id="catalog" class="catalog"></div>
  <label class="upload" for="upfile"><b>Upload your own file</b><span>CSV with latitude and longitude, GeoJSON, GeoParquet, FlatGeobuf or GeoTIFF. You can also drop a file on the map. It never leaves your laptop.</span><input type="file" id="upfile" accept=".csv,.geojson,.json,.parquet,.fgb,.tif,.tiff"></label>
</dialog>
<script type="module" src="js/app.js?v=12"></script>
</body>
</html>
