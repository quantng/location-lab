<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoAI · Location Lab</title>
<meta name="description" content="The eight categories of GeoAI, one tab each: spatially explicit machine learning, geospatial computer vision, spatial representation learning, geospatial foundation models, spatio-temporal and network AI, geo-language AI, generative GeoAI and Earth-system AI.">
<link rel="stylesheet" href="geoai.css?v=3">
<style>
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column}
.cat-bar{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#f7f8fb}
.cat-bar button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:600 13.5px/1.2 inherit;font-family:inherit;color:#14213d;cursor:pointer;min-height:44px}
.cat-bar button span{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e6eaf2;color:#1e3063;font-size:13px}
.cat-bar button[aria-selected=true]{background:#1e3063;color:#fff;border-color:#1e3063}
.cat-bar button[aria-selected=true] span{background:#c00000;color:#fff}
.cat-stage{flex:1;position:relative;min-height:0}
.cat-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.cat-stage iframe.on{display:block}
@media (max-width:1100px){.cat-bar{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="ga-top">
  <div class="ga-brand"><span class="ga-mark" aria-hidden="true"></span><b>Location Lab</b><span class="ga-sub">· GeoAI: the eight categories</span></div>
  <span class="ga-spacer"></span>
  <a class="ga-ghost" href="../yourdata/" rel="noopener" style="background:#c00000;color:#fff;border-color:#c00000">Use your own data →</a>
  <a class="ga-ghost" href="../geoai2/video/GeoAI_8_categories_walkthrough.mp4" target="_blank" rel="noopener">Video</a>
  <a class="ga-ghost" href="../" rel="noopener">← Workbench</a>
</header>
<nav class="cat-bar" role="tablist" id="cats"></nav>
<main class="cat-stage" id="stage"></main>
<script>
// One tab per GeoAI category; each loads the matching Location Lab view in embedded mode.
const CATS = [
  ['Spatial ML', '../geoml/?embed=1&tab=gwr&tabs=gwr,rf'],
  ['Computer vision', 'studio.html?embed=1&tab=chg'],
  ['Representation learning', 'studio.html?embed=1&tab=sim&tabs=sim,ws'],
  ['Foundation models', 'studio.html?embed=1&tab=teach'],
  ['Network AI', '../geoai2/?embed=1&tab=net'],
  ['Geo-language AI', '../geoai2/?embed=1&tab=lang'],
  ['Generative GeoAI', '../geoai2/?embed=1&tab=gen'],
  ['Earth-system AI', '../geoai2/?embed=1&tab=wx'],
];
const bar = document.getElementById('cats'), stage = document.getElementById('stage'), frames = {};
CATS.forEach(([n], i) => { const b = document.createElement('button'); b.role = 'tab'; b.dataset.k = i + 1; b.innerHTML = `<span>${i + 1}</span>${n}`; b.onclick = () => open(i + 1); bar.appendChild(b); });
function open(k) {
  if (!frames[k]) { const f = document.createElement('iframe'); f.id = 'f' + k; f.name = 'cat' + k; f.title = CATS[k - 1][0]; f.src = CATS[k - 1][1]; stage.appendChild(f); frames[k] = f; }
  Object.entries(frames).forEach(([j, f]) => f.classList.toggle('on', +j === k));
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', +b.dataset.k === k));
  history.replaceState(null, '', '#' + k); window.__cat = k;
}
open(Math.min(8, Math.max(1, parseInt(location.hash.slice(1)) || 1)));
</script>
</body>
</html>
